# One-command stack: PostgreSQL + WMS.  `docker compose up --build`  ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
      POSTGRES_DB: wms
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms"]
      interval: 3s
      retries: 20
  wms:
    build: .
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      WMS_DATABASE_URL: postgresql+psycopg://wms:wms@db:5432/wms
      WMS_SECRET_KEY: ${WMS_SECRET_KEY:-change-me}
      WMS_ADMIN_PASSWORD: ${WMS_ADMIN_PASSWORD:-admin}
      WMS_SEED_DEMO_DATA: ${WMS_SEED_DEMO_DATA:-true}
      # Address external systems (e.g. SOFTBOT) use to reach the WMS; sent in event payloads
      WMS_PUBLIC_URL: ${WMS_PUBLIC_URL:-http://localhost:8000}
    # lets the container reach services on the host PC as http://host.docker.internal:<port>
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  pgdata:
