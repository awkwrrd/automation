# One-command stack: PostgreSQL + WMS.  `docker compose up --build`  ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
      POSTGRES_DB: wms
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms"]
      interval: 3s
      retries: 20
  wms:
    build: .
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      WMS_DATABASE_URL: postgresql+psycopg://wms:wms@db:5432/wms
      WMS_SECRET_KEY: ${WMS_SECRET_KEY:-change-me}
      WMS_ADMIN_PASSWORD: ${WMS_ADMIN_PASSWORD:-admin}
      WMS_SEED_DEMO_DATA: ${WMS_SEED_DEMO_DATA:-true}
      # Address external systems (e.g. SOFTBOT) use to reach the WMS; sent in event payloads
      WMS_PUBLIC_URL: ${WMS_PUBLIC_URL:-http://localhost:8000}
    # lets the container reach services on the host PC as http://host.docker.internal:<port>
    extra_hosts: ["host.docker.internal:host-gateway"]
  # Stand-in picking system (KFX / AutoStore) for proofs of concept: answers 200 to whatever the
  # outbound SOFTBOT POSTs and lists the messages at http://localhost:9100
  mock-picking:
    image: python:3.13-slim
    command: ["python", "-u", "/app/server.py", "--port", "9100"]
    volumes: ["./tools/mock_picking:/app:ro"]
    ports: ["9100:9100"]
    environment:
      # set in .env before exposing the mock through the tunnel; then POSTs need header x-api-key
      MOCK_API_KEY: ${MOCK_PICKING_API_KEY:-}
    restart: unless-stopped

  # Public HTTPS address for the mock, so a cloud-hosted SOFTBOT platform can reach it.
  # Only starts with:  docker compose --profile tunnel up --build
  # The address (https://<random>.trycloudflare.com) is printed in this service's log and changes on restart.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "--url", "http://mock-picking:9100"]
    depends_on: [mock-picking]
    profiles: ["tunnel"]
    restart: unless-stopped

volumes:
  pgdata:
